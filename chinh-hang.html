<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Hàng Chính Hãng</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            max-width: 480px; /* Mobile width constraint to match app feel */
            margin: 0 auto;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* VNPT Check style header */
        .header {
            background-color: #0b4fcc;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .header-left i {
            font-size: 18px;
            opacity: 0.9;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .success-section {
            padding: 40px 20px 25px;
            text-align: center;
        }

        .check-circle {
            width: 100px;
            height: 100px;
            border: 5px solid #63b34b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .check-circle i {
            font-size: 60px;
            color: #63b34b;
        }

        .title {
            font-size: 20px;
            color: #555;
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            font-style: italic;
        }

        .product-card {
            background-color: #fdf5f9;
            padding: 20px 20px 25px;
            border-top: 1px solid #f2e8ef;
            border-bottom: 1px solid #f2e8ef;
        }

        .product-name {
            color: #d13041;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .product-code {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .btn-sm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #7dcf72;
            color: white;
            padding: 7px 14px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .btn-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #5ab551;
            color: white;
            padding: 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
        }

        .rating-section {
            background-color: #f3f3f9;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e2e2ec;
        }

        .rating-text {
            color: #5c6bc0;
            font-size: 14px;
            font-weight: 500;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .stars i {
            color: #8c9eff;
            font-size: 16px;
        }

        .info-section {
            padding: 25px 20px;
            text-align: center;
        }

        .info-title {
            font-size: 16px;
            color: #666;
            font-weight: 500;
            margin: 15px 0;
            letter-spacing: 0.5px;
        }

        .info-logo {
            max-width: 160px;
            height: auto;
            margin: 10px auto 25px;
            display: block;
        }

        .decorative-line {
            height: 1px;
            border-top: 2px dashed #d1d5db;
            margin: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <i class="fas fa-barcode"></i>
        </div>
        <div class="header-right">
            <span>🇻🇳 Tiếng Việt</span>
            <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
        </div>
    </header>

    <main>
        <div class="success-section">
            <div class="check-circle">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="title">SẢN PHẨM CHÍNH HÃNG</h1>
            <p class="subtitle">Xin cảm ơn bạn đã mua hàng!</p>
        </div>

        <div class="product-card">
            <h2 class="product-name">Sâm Mật Ong Đại Việt</h2>
            <p class="product-code">Mã SP: 01613561827237</p>
            
            <a href="index.html#product" class="btn-sm">
                Xem thêm <i class="fas fa-chevron-circle-right"></i>
            </a>
            
            <a href="index.html#order" class="btn-block">
                <i class="fas fa-shopping-cart"></i> Mua sản phẩm
            </a>
        </div>

        <div class="rating-section">
            <span class="rating-text">Đánh giá & Bình luận:</span>
            <div class="stars">
                <i class="far fa-star"></i>
                <i class="far fa-star"></i>
                <i class="far fa-star"></i>
                <i class="far fa-star"></i>
                <i class="far fa-star"></i>
            </div>
        </div>

        <div class="info-section">
            <div class="decorative-line"></div>
            <h3 class="info-title">THÔNG TIN SẢN PHẨM</h3>
            <img src="assets/images/logo.png" alt="Đại Việt" class="info-logo" onerror="this.src='assets/images/Logo ung dung (transparent).png'">
            <div class="decorative-line"></div>
        </div>
    </main>
</body>
</html>
