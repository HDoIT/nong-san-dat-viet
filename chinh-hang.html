<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Hàng Chính Hãng - Sâm Mật Ong Đại Việt</title>
    <meta name="description" content="Hệ thống xác thực sản phẩm chính hãng của Nông Sản Đại Việt.">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #1b4d3e; /* Deep green */
            --secondary-color: #d4af37; /* Gold */
            --bg-color: #0d1a15;
            --text-light: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --success-color: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(27, 77, 62, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.15), transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUpIn 0.8s ease forwards;
        }

        @keyframes fadeUpIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .status-icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .status-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.4);
            z-index: 2;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--secondary-color);
            margin-bottom: 10px;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        .subtitle {
            font-size: 16px;
            color: #a0aec0;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 0.5s ease 1.2s forwards;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            opacity: 0;
            animation: fadeUpIn 0.5s ease 1.4s forwards;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .product-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--glass-border);
        }

        .product-info h3 {
            font-size: 18px;
            color: white;
            margin-bottom: 5px;
            font-family: 'Playfair Display', serif;
        }

        .product-info p {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .product-info p i {
            color: var(--secondary-color);
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            animation: fadeUpIn 0.5s ease 1.6s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-color), #b89326);
            color: #000;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 18px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--secondary-color);
            border-radius: 50%;
            animation: float 5s infinite;
            opacity: 0.5;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }
        
        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            opacity: 0;
            animation: fadeIn 0.5s ease 1.8s forwards;
        }

        /* Sparkle animation for premium feel */
        .sparkle {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            top: 0;
            left: -100%;
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { left: 200%; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="auth-container">
        <img src="assets/images/logo.png" alt="Đại Việt" class="logo" onerror="this.src='assets/images/Logo ung dung (transparent).png'">
        
        <div class="status-icon-wrapper">
            <div class="status-icon-bg"></div>
            <div class="status-icon">
                <i class="fas fa-check"></i>
            </div>
        </div>
        
        <h1 class="title">Xác Thực Thành Công</h1>
        <p class="subtitle">Sản phẩm chính hãng từ Nông Sản Đại Việt</p>
        
        <div class="product-card">
            <img src="assets/images/extracted_center.png" alt="Sâm Mật Ong" class="product-img">
            <div class="product-info">
                <h3>Sâm Mật Ong Đại Việt</h3>
                <p><i class="fas fa-shield-alt"></i> Phân phối chính hãng</p>
                <p><i class="fas fa-award"></i> Đạt chuẩn chất lượng ISO</p>
                <p><i class="fas fa-barcode"></i> Mã xác thực hợp lệ</p>
            </div>
        </div>
        
        <div class="action-buttons">
            <a href="index.html#product" class="btn btn-secondary">
                <i class="fas fa-box-open"></i> Xem Thêm Sản Phẩm
            </a>
            <a href="index.html#order" class="btn btn-primary">
                <div class="sparkle"></div>
                <i class="fas fa-shopping-cart"></i> Đặt Hàng Ngay
            </a>
        </div>
        
        <p class="footer-note">
            Cảm ơn quý khách đã tin dùng sản phẩm của Nông Sản Đại Việt.
        </p>
    </div>

    <script>
        // Create subtle particle effect
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = Math.random() * 100 + 'vh';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.animationDuration = 3 + Math.random() * 4 + 's';
            
            // Randomly use gold or green for particles
            if (Math.random() > 0.5) {
                particle.style.background = '#22c55e'; // green
            }
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
